name: Build & Test

on:
  push:
    branches: [main, master, release]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o cc-proxy .
