services:
  proxy:
    build: .
    ports:
      - "${PROXY_PORT:-3050}:3050"
    environment:
      PORT: "3050"
      # 上游 key 池（Command Code API key，user_xxx），逗号分隔
      CC_UPSTREAM_KEYS: "${CC_UPSTREAM_KEYS:-}"
      # 向下游分发的客户端 key；留空 = 透传模式（客户端自带 key 直接用）
      CC_CLIENT_KEYS: "${CC_CLIENT_KEYS:-}"
      # 上游 key 轮换策略：round_robin | random
      CC_KEY_STRATEGY: "${CC_KEY_STRATEGY:-round_robin}"
      # 单请求最多尝试几个上游 key
      CC_KEY_FAILOVER: "${CC_KEY_FAILOVER:-2}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
